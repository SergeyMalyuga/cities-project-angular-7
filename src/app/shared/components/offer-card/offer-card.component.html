<article
  appHoverTracker
  (hovered)="onHovered($event)"
  class="cities__card place-card"
>
  @if (offer.isPremium) {
    <div class="place-card__mark">
      <span>Premium</span>
    </div>
  }
  <div class="cities__image-wrapper place-card__image-wrapper">
    <a [routerLink]="['/', AppRoute.OFFER, offer.id]">
      <img
        class="place-card__image"
        src="{{ offer.previewImage }}"
        width="260"
        height="200"
        alt="Place image"
      />
    </a>
  </div>
  <div class="place-card__info">
    <div class="place-card__price-wrapper">
      <div class="place-card__price">
        <b class="place-card__price-value">&euro;{{ offer.price }}</b>
        <span class="place-card__price-text">&#47;&nbsp;night</span>
      </div>
      <button
        [ngClass]="{
          'place-card__bookmark-button': true,
          button: true,
          'place-card__bookmark-button--active':
            isAuth(authStatus()) && offer.isFavorite,
        }"
        (click)="toggleFavoriteOffer()"
        [disabled]="isLoading()"
        type="button"
      >
        <svg class="place-card__bookmark-icon" width="18" height="19">
          <use xlink:href="#icon-bookmark"></use>
        </svg>
        <span class="visually-hidden">To bookmarks</span>
      </button>
    </div>
    <div class="place-card__rating rating">
      <div class="place-card__stars rating__stars">
        <span [style.width.%]="getRatingWidth(offer.rating)"></span>
        <span class="visually-hidden">Rating</span>
      </div>
    </div>
    <h2 class="place-card__name">
      <a [routerLink]="['/', AppRoute.OFFER, offer.id]">{{ offer.title }}</a>
    </h2>
    <p class="place-card__type">{{ offer.type | titlecase }}</p>
  </div>
</article>
